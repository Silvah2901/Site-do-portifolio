<svg id="bellaTavolaRoundSVG" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%" style="font-family: 'Cormorant Garamond', Georgia, serif;">
            <defs>
              <!-- Embedded Web Fonts for standalone rendering -->
              <style>
                @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&amp;family=Karla:wght@500;700&amp;display=swap');
                .title-font { font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 700; }
                .sans-font { font-family: 'Karla', sans-serif; font-weight: 700; letter-spacing: 0.22em; }
              </style>

              <!-- Gradients -->
              <!-- Main Radial Background Glow -->
              <radialGradient id="roundBgGlow" cx="50%" cy="45%" r="50%">
                <stop offset="0%" stop-color="#3d2615"/>
                <stop offset="65%" stop-color="#18100a"/>
                <stop offset="100%" stop-color="#0b0805"/>
              </radialGradient>

              <!-- Gold Foil Gradient -->
              <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#fef2d0"/>
                <stop offset="35%" stop-color="#d4af37"/>
                <stop offset="70%" stop-color="#aa7c11"/>
                <stop offset="100%" stop-color="#f5e1a4"/>
              </linearGradient>

              <!-- Inner Vignette Gradient for Rim Depth -->
              <radialGradient id="rimShadow" cx="50%" cy="50%" r="50%">
                <stop offset="85%" stop-color="#000000" stop-opacity="0"/>
                <stop offset="100%" stop-color="#000000" stop-opacity="0.75"/>
              </radialGradient>

              <!-- Warm Oven Amber Glow -->
              <radialGradient id="hearthGlow" cx="50%" cy="75%" r="45%">
                <stop offset="0%" stop-color="#e26d2d" stop-opacity="0.3"/>
                <stop offset="100%" stop-color="#e26d2d" stop-opacity="0"/>
              </radialGradient>

              <!-- Text Shadow Filter -->
              <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.9"/>
              </filter>
              
              <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="3" result="blur"/>
                <feComposite in="SourceGraphic" in2="blur" operator="over"/>
              </filter>

              <!-- Circular Text Path -->
              <path id="textArcTop" d="M 180,400 A 220,220 0 1,1 620,400" fill="none"/>
              <path id="textArcBottom" d="M 620,400 A 220,220 0 0,1 180,400" fill="none"/>
            </defs>

            <!-- Clip Path to keep content perfectly circular -->
            <clipPath id="circleClip">
              <circle cx="400" cy="400" r="380"/>
            </clipPath>

            <!-- MAIN CIRCLE BASE -->
            <g clip-path="url(#circleClip)">
              <!-- Background Base -->
              <circle cx="400" cy="400" r="380" fill="url(#roundBgGlow)"/>
              <circle cx="400" cy="400" r="380" fill="url(#hearthGlow)"/>

              <!-- Decorative Concentric Pattern Rings -->
              <circle cx="400" cy="400" r="365" fill="none" stroke="#c9a45c" stroke-width="1" opacity="0.25"/>
              <circle cx="400" cy="400" r="350" fill="none" stroke="url(#goldGradient)" stroke-width="1.5" opacity="0.5" stroke-dasharray="6,4"/>
              <circle cx="400" cy="400" r="275" fill="none" stroke="#c9a45c" stroke-width="1" opacity="0.3"/>

              <!-- ===== BACKGROUND GASTRONOMY ILLUSTRATIONS ===== -->

              <!-- LEFT: Handmade Tagliatelle & Wine -->
              <g transform="translate(130, 480)" filter="url(#dropShadow)" opacity="0.85">
                <!-- Plate -->
                <ellipse cx="80" cy="90" rx="90" ry="32" fill="#18130e" stroke="#3d3023" stroke-width="2"/>
                <ellipse cx="80" cy="90" rx="72" ry="24" fill="#241b13" stroke="#c9a45c" stroke-width="0.5" opacity="0.6"/>
                <!-- Pasta Nest -->
                <path d="M 30,88 Q 50,60 80,85 T 130,80 Q 110,105 80,96 T 30,88 Z" fill="#d99b36"/>
                <path d="M 40,84 C 55,65 85,70 100,88 C 80,100 55,95 40,84 Z" fill="#e8b151"/>
                <!-- Sauce & Parsley -->
                <ellipse cx="78" cy="84" rx="26" ry="9" fill="#8c2318"/>
                <circle cx="74" cy="82" r="2.5" fill="#4a7c36"/>
                <circle cx="82" cy="85" r="2" fill="#588f40"/>
                <circle cx="78" cy="80" r="1.5" fill="#fdf0cd" opacity="0.9"/>

                <!-- Glass of Red Wine -->
                <g transform="translate(135, -50)">
                  <ellipse cx="20" cy="110" rx="15" ry="5" fill="#120e0a" stroke="#443527" stroke-width="1"/>
                  <line x1="20" y1="110" x2="20" y2="60" stroke="#776655" stroke-width="2" opacity="0.7"/>
                  <path d="M 6,20 Q 4,50 20,60 Q 36,50 34,20 Z" fill="none" stroke="#998877" stroke-width="1.2" opacity="0.6"/>
                  <path d="M 8,32 Q 6,48 20,54 Q 34,48 32,32 Z" fill="#6b1119" opacity="0.9"/>
                  <ellipse cx="20" cy="32" rx="12" ry="3.5" fill="#8d1a24"/>
                </g>
              </g>

              <!-- RIGHT: Wood-Fired Pizza on Wooden Board -->
              <g transform="translate(480, 480)" filter="url(#dropShadow)" opacity="0.85">
                <!-- Wooden Paddle Board -->
                <ellipse cx="110" cy="95" rx="105" ry="38" fill="#1d130c" stroke="#3a2719" stroke-width="2"/>
                <path d="M 205,90 L 245,102 Q 250,105 242,110 L 195,102 Z" fill="#1d130c" stroke="#3a2719" stroke-width="1.5"/>
                
                <!-- Pizza Base -->
                <ellipse cx="110" cy="90" rx="90" ry="30" fill="#b07236" stroke="#854d1f" stroke-width="3"/>
                <ellipse cx="110" cy="90" rx="80" ry="25" fill="#a0321a"/> <!-- Tomato Sauce -->
                
                <!-- Mozzarella & Basil -->
                <ellipse cx="80" cy="87" rx="16" ry="6" fill="#f5e6cd"/>
                <ellipse cx="125" cy="83" rx="20" ry="7" fill="#f8ebd5"/>
                <ellipse cx="100" cy="97" rx="15" ry="5" fill="#f5e6cd"/>
                <ellipse cx="145" cy="93" rx="13" ry="5" fill="#f8ebd5"/>
                <circle cx="120" cy="83" r="3" fill="#a81a10"/>
                <circle cx="83" cy="88" r="2.5" fill="#a81a10"/>
                <path d="M 95,83 Q 100,75 105,82 Q 100,87 95,83 Z" fill="#3b6e28"/>
                <path d="M 130,90 Q 135,84 140,91 Q 134,95 130,90 Z" fill="#447d30"/>
              </g>

              <!-- Vignette Overlay -->
              <circle cx="400" cy="400" r="380" fill="url(#rimShadow)"/>

              <!-- ===== CENTER BRAND HIGHLIGHT BLOCK ===== -->
              
              <!-- Subtle Backdrop Plate for Text Contrast -->
              <ellipse cx="400" cy="380" rx="250" ry="140" fill="#0d0a07" opacity="0.75" filter="blur(10px)"/>

              <g transform="translate(400, 310)" text-anchor="middle" filter="url(#dropShadow)">
                
                <!-- Top Decorative Emblem (Wheat / Crown) -->
                <g stroke="url(#goldGradient)" fill="none" stroke-width="1.5" opacity="0.9">
                  <path d="M -45,-30 Q -15,-45 0,-20 Q 15,-45 45,-30"/>
                  <circle cx="0" cy="-20" r="3" fill="#c9a45c"/>
                  <circle cx="-20" cy="-33" r="2" fill="#c9a45c"/>
                  <circle cx="20" cy="-33" r="2" fill="#c9a45c"/>
                </g>

                <!-- Top Sub-Header -->
                <text y="10" class="sans-font" fill="#c9a45c" font-size="14" opacity="0.95">TRATTORIA &amp; PIZZERIA</text>

                <!-- MAIN PROMINENT TITLE: Bella Tavola -->
                <text y="82" class="title-font" font-size="78" fill="url(#goldGradient)" filter="url(#subtleGlow)" letter-spacing="1">
                  Bella Tavola
                </text>

                <!-- SECONDARY PROMINENT TITLE: RESTAURANT -->
                <text y="132" class="title-font" font-size="36" fill="#f3ead8" letter-spacing="7" opacity="0.98">
                  RESTAURANT
                </text>

                <!-- Decorative Divider Line -->
                <g transform="translate(0, 155)">
                  <line x1="-150" y1="0" x2="150" y2="0" stroke="url(#goldGradient)" stroke-width="1.5" opacity="0.8"/>
                  <polygon points="0,-5 6,0 0,5 -6,0" fill="#c9a45c"/>
                </g>

                <!-- Tagline Below -->
                <text y="188" class="title-font" font-size="22" fill="#d9cbb3" font-style="italic">
                  Authentic Italian Dining
                </text>
              </g>

              <!-- Star Rating / Guarantee Arc -->
              <g text-anchor="middle" fill="#c9a45c" font-size="14" opacity="0.8" transform="translate(400, 565)">
                <text font-family="'Karla', sans-serif" font-weight="700" letter-spacing="0.3em">★ ★ ★ ★ ★</text>
              </g>

            </g> <!-- End Circle Clip Group -->

            <!-- ===== OUTER GOLD FRAME RIMS ===== -->
            <circle cx="400" cy="400" r="378" fill="none" stroke="url(#goldGradient)" stroke-width="5" filter="url(#dropShadow)"/>
            <circle cx="400" cy="400" r="371" fill="none" stroke="#0d0b09" stroke-width="3"/>
            <circle cx="400" cy="400" r="367" fill="none" stroke="#c9a45c" stroke-width="1" opacity="0.6"/>

          </svg>