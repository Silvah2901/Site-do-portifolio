<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Fonts Import inside SVG for standalone rendering -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=Plus+Jakarta+Sans:wght@700;800;900&amp;display=swap');
      
      .svg-main-title {
        font-family: 'Bebas Neue', 'Impact', sans-serif;
        font-size: 68px;
        fill: url(#textGoldGrad);
        text-anchor: middle;
        letter-spacing: 3px;
        filter: drop-shadow(0px 4px 10px rgba(0,0,0,0.95));
      }

      .svg-subtitle {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-size: 13px;
        font-weight: 800;
        fill: #ffb700;
        text-anchor: middle;
        letter-spacing: 5px;
      }

      .svg-top-text {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-size: 11px;
        font-weight: 800;
        fill: #d1d5db;
        letter-spacing: 4px;
      }
    </style>

    <!-- Radial Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#1c110b" />
      <stop offset="50%" stop-color="#0e0a0d" />
      <stop offset="100%" stop-color="#050507" />
    </radialGradient>

    <!-- Metallic Gold/Silver Text Gradient -->
    <linearGradient id="textGoldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>

    <!-- Flame Dynamic Gradient -->
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="50%" stop-color="#ff5a00" />
      <stop offset="100%" stop-color="#ffb700" />
    </linearGradient>

    <!-- Patty Dark Flame-Grilled Gradient -->
    <linearGradient id="pattyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d1e11" />
      <stop offset="50%" stop-color="#241007" />
      <stop offset="100%" stop-color="#140703" />
    </linearGradient>

    <!-- Cheese Flow Gradient -->
    <linearGradient id="cheeseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Bun Top Soft Gradient -->
    <linearGradient id="bunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="60%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Circular Path for Top Text -->
    <path id="textCirclePath" d="M 105,300 A 195,195 0 1,1 495,300" />
  </defs>

  <!-- Outer Dark Base Circle -->
  <circle cx="300" cy="300" r="285" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="4" />

  <!-- Outer Neon Ring 1 -->
  <circle cx="300" cy="300" r="272" fill="none" stroke="#ff5a00" stroke-width="5" filter="url(#neonGlowFilter)" opacity="0.9" />

  <!-- Inner Dashed Ring -->
  <circle cx="300" cy="300" r="258" fill="none" stroke="#ffb700" stroke-width="2" stroke-dasharray="8,8" opacity="0.5" />

  <!-- Top Curved Text -->
  <text class="svg-top-text">
    <textPath href="#textCirclePath" startOffset="50%" text-anchor="middle">
      • EST. 2026 • PREMIUM QUALITY •
    </textPath>
  </text>

  <!-- Background Flame Graphics (Stylized Art) -->
  <g class="flame-anim" transform="translate(0, 10)">
    <!-- Back Flame Shapes -->
    <path d="M 230 260 C 210 200, 250 140, 270 110 C 280 160, 310 130, 330 100 C 360 150, 390 200, 370 260 Z" fill="url(#flameGrad)" opacity="0.3" />
    <path d="M 250 270 C 235 220, 270 170, 285 140 C 295 180, 325 155, 340 125 C 365 170, 375 220, 350 270 Z" fill="url(#flameGrad)" opacity="0.7" />
    <path d="M 270 275 C 260 235, 285 200, 295 175 C 302 205, 320 185, 330 160 C 345 195, 350 235, 330 275 Z" fill="#fef08a" opacity="0.9" />
  </g>

  <!-- Burger Smash Centerpiece Group -->
  <g transform="translate(180, 140)">
    
    <!-- Top Bun Shadow -->
    <ellipse cx="120" cy="110" rx="95" ry="16" fill="#000000" opacity="0.4" />

    <!-- Top Bun (Pão Artesanal Brioche) -->
    <path d="M 28 100 C 28 42, 60 20, 120 20 C 180 20, 212 42, 212 100 Z" fill="url(#bunGrad)" stroke="#78350f" stroke-width="2" />
    <!-- Bun Shine Accent -->
    <path d="M 50 60 C 70 38, 110 32, 140 35 C 100 30, 65 42, 50 60 Z" fill="#ffffff" opacity="0.25" />

    <!-- Gergelim Seeds -->
    <g fill="#fef08a" opacity="0.9">
      <ellipse cx="70" cy="50" rx="3.5" ry="2" transform="rotate(-15 70 50)" />
      <ellipse cx="110" cy="40" rx="3.5" ry="2" transform="rotate(10 110 40)" />
      <ellipse cx="150" cy="52" rx="3.5" ry="2" transform="rotate(25 150 52)" />
      <ellipse cx="90" cy="65" rx="3.5" ry="2" transform="rotate(-5 90 65)" />
      <ellipse cx="130" cy="68" rx="3.5" ry="2" transform="rotate(15 130 68)" />
      <ellipse cx="170" cy="72" rx="3.5" ry="2" transform="rotate(-20 170 72)" />
    </g>

    <!-- Alface / Special Sauce Layer -->
    <path d="M 20 102 Q 35 116 50 102 T 80 102 T 110 102 T 140 102 T 170 102 T 200 102 Q 215 116 220 100 L 210 95 L 30 95 Z" fill="#22c55e" />
    <!-- Crisp Lettuce Highlights -->
    <path d="M 25 103 Q 35 114 45 103 M 85 103 Q 95 114 105 103 M 145 103 Q 155 114 165 103" stroke="#86efac" stroke-width="2.5" fill="none" stroke-linecap="round" />

    <!-- Smash Patty 1 (Upper Crispy Edge) -->
    <path d="M 10 110 C 10 106, 230 106, 230 110 C 238 120, 225 128, 215 124 C 180 126, 150 123, 120 126 C 80 123, 40 127, 25 123 C 12 125, 2 118, 10 110 Z" fill="url(#pattyGrad)" stroke="#180a05" stroke-width="1.5" />

    <!-- Melted Cheese Layer (Derretido Escorrendo) -->
    <path d="M 18 118 
             C 40 120, 50 145, 62 145 
             C 72 145, 78 124, 95 124 
             C 110 124, 118 158, 132 158 
             C 145 158, 155 122, 175 122 
             C 195 122, 205 138, 218 120 
             Z" fill="url(#cheeseGrad)" filter="drop-shadow(0px 3px 4px rgba(0,0,0,0.7))" />

    <!-- Smash Patty 2 (Ultra Thin Crispy Double Smash) -->
    <path d="M 5 128 C 5 124, 235 124, 235 128 C 243 138, 220 144, 205 142 C 160 143, 130 140, 90 144 C 50 141, 30 145, 15 140 C 3 140, -3 134, 5 128 Z" fill="url(#pattyGrad)" stroke="#000000" stroke-width="2" />

    <!-- Bottom Bun -->
    <path d="M 32 140 L 208 140 C 208 140, 198 165, 170 168 C 130 170, 110 170, 70 168 C 42 165, 32 140, 32 140 Z" fill="#d97706" />

    <!-- Molho Especial Drips -->
    <circle cx="75" cy="154" r="3" fill="#ef4444" />
    <circle cx="152" cy="165" r="2.5" fill="#ef4444" />
  </g>

  <!-- Banner Box Behind Main Text for Legibility -->
  <rect x="60" y="325" width="480" height="110" rx="20" fill="#090a0f" opacity="0.92" stroke="#ff5a00" stroke-width="2.5" filter="drop-shadow(0px 10px 20px rgba(0,0,0,0.8))" />

  <!-- Decorative Banner Side Accents -->
  <path d="M 75 345 L 95 345 M 75 415 L 95 415 M 505 345 L 525 345 M 505 415 L 525 415" stroke="#ffb700" stroke-width="3" stroke-linecap="round" />

  <!-- Main Brand Title -->
  <text x="300" y="395" class="svg-main-title">SMASH DISTRICT</text>

  <!-- Subtitle Text -->
  <text x="300" y="422" class="svg-subtitle">BURGERS &amp; CRAFT BEER</text>

  <!-- Bottom Stars & Flame Icon Detail -->
  <g transform="translate(240, 455)">
    <!-- Left Line -->
    <line x1="-50" y1="12" x2="20" y2="12" stroke="#ff5a00" stroke-width="2" stroke-linecap="round" />
    
    <!-- Star Left -->
    <path d="M 35 12 L 37 6 L 43 6 L 38 18 L 40 24 L 35 20 L 30 24 L 32 18 L 27 6 L 33 6 Z" fill="#ffb700" transform="scale(0.5) translate(40, 0)" />
    
    <!-- Center Mini Flame Icon -->
    <path d="M 60 22 C 55 15, 60 8, 62 4 C 65 9, 70 7, 72 2 C 76 8, 78 15, 73 22 Z" fill="#ff5a00" />
    
    <!-- Star Right -->
    <path d="M 85 12 L 87 6 L 93 6 L 88 18 L 90 24 L 85 20 L 80 24 L 82 18 L 77 6 L 83 6 Z" fill="#ffb700" transform="scale(0.5) translate(110, 0)" />
    
    <!-- Right Line -->
    <line x1="100" y1="12" x2="170" y2="12" stroke="#ff5a00" stroke-width="2" stroke-linecap="round" />
  </g>
</svg>